matches:
  - triggers: ["color_ ", ":color ", "col_ ", ":col ", "cc_ ", ":cc "]
    label: "Write a class color"
    replace: ' class="{{color}}" '
    vars:
      - name: color
        type: choice
        default: "cyan"
        params:
          message: "Select a color:"
          values:
            - id: "white"
              label: "White"
            - id: "black"
              label: "Black"
            - id: "cyan"
              label: "Cyan"
            - id: "red"
              label: "Red"
            - id: "blue"
              label: "Blue"
            - id: "green"
              label: "Green"
            - id: "yellow"
              label: "Yellow"
            - id: "gray"
              label: "Gray"
            - id: "orange"
              label: "Orange"
            - id: "purple"
              label: "Purple"
            - id: "pink"
              label: "Pink"
            - id: "brown"
              label: "Brown"

  - triggers: [":white ", "white_ ", "wh_ ", ":wh "]
    replace: ' class="white" '

  - triggers: [":black ", "black_ ", "bk_ ", ":bk "]
    replace: ' class="black" '

  - triggers: [":cyan ", "cyan_ ", "cy_ ", ":cy "]
    replace: ' class="cyan" '

  - triggers: [":red ", "red_ ", "r_ ", ":r "]
    replace: ' class="red" '

  - triggers: [":blue ", "blue_ ", "b_ ", ":b "]
    replace: ' class="blue" '

  - triggers: [":green ", "green_ ", "g_ ", ":g "]
    replace: ' class="green" '

  - triggers: [":yellow ", "yellow_ ", "y_ ", ":y "]
    replace: ' class="yellow" '

  - triggers: [":gray ", "gray_ ", "gr_ ", ":gr "]
    replace: ' class="gray" '

  - triggers: [":orange ", "orange_ ", "o_ ", ":o "]
    replace: ' class="orange" '

  - triggers: [":purple ", "purple_ ", "p_ ", ":p "]
    replace: ' class="purple" '

  - triggers: [":pink ", "pink_ ", "pk_ ", ":pk "]
    replace: ' class="pink" '

  - triggers: [":brown ", "brown_ ", "br_ ", ":br "]
    replace: ' class="brown" '
