matches:
  - triggers:
      - "icon_ "
      - ":icon "
      - "ic_ "
      - ":ic"
      - "filter_ "
      - ":filter"
      - "filt_ "
      - ":filt"
    label: "Add class icon with color filter"
    replace: "icon {{color}}-filter"
    vars:
      - name: color
        type: choice
        params:
          message: "Select a color:"
          values:
            - label: "White"
              id: "white"
            - label: "Black"
              id: "black"
            - label: "Cyan"
              id: "cyan"
            - label: "Red"
              id: "red"
            - label: "Blue"
              id: "blue"
            - label: "Green"
              id: "green"
            - label: "Yellow"
              id: "yellow"
            - label: "White"
              id: "white"
            - label: "Gray"
              id: "gray"
            - label: "Orange"
              id: "orange"
            - label: "Purple"
              id: "purple"
            - label: "Pink"
              id: "pink"
            - label: "Brown"
              id: "brown"
